[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian"
version = "0.1.0"
description = "Evidence-gated offline scam-call analysis"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "openai>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["guardian"]

[tool.setuptools.package-data]
guardian = ["static/*.html", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
# Hosted demo entry point: forces replay mode (see vercel_app.py).
entrypoint = "vercel_app:app"
